        <!-- HERO: connected home at dusk, fiber entering the house -->

                <path d="M120 200 L 290 90 L 460 200 L 460 400 L 120 400 Z" fill="#f4f1ff"></path>

                <rect x="318" y="250" width="118" height="70" rx="6" fill="#1b1340"></rect>
                <rect x="325" y="257" width="104" height="56" rx="3" fill="#5b2be0"></rect>
                <path d="M325 300 L 360 275 L 385 292 L 405 278 L 429 296 L 429 313 L 325 313 Z" fill="#5fe0cc" opacity="0.85"></path>

                <rect x="177" y="243" width="48" height="24" rx="2" fill="#5fe0cc"></rect>
                <circle cx="248" cy="250" r="12" fill="#ff9e6b"></circle>
                <!-- ground floor: router -->
                <rect x="160" y="360" width="64" height="22" rx="8" fill="#1b1340"></rect>
                <circle cx="176" cy="371" r="3" fill="#5fe0cc"></circle>
                <circle cx="188" cy="371" r="3" fill="#5fe0cc"></circle>
                <rect x="170" y="340" width="4" height="20" rx="2" fill="#1b1340"></rect>
                <rect x="210" y="340" width="4" height="20" rx="2" fill="#1b1340"></rect>
                <!-- wifi arcs -->
                <path d="M162 330 A 40 40 0 0 1 222 330" stroke="#5b2be0" stroke-width="6" fill="none" stroke-linecap="round"></path>
                <path d="M146 316 A 62 62 0 0 1 238 316" stroke="#5b2be0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"></path>
                <path d="M132 302 A 84 84 0 0 1 252 302" stroke="#5b2be0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.3"></path>

                <rect x="226" y="150" width="4" height="40" fill="#f4f1ff"></rect>

        </template>

        <!-- TV -->
        <template lwc:if={isTv}>

                <rect x="106" y="110" width="268" height="2" fill="#ffffff" opacity="0.7"></rect>
                <circle cx="240" cy="111" r="22" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7"></circle>
                <circle cx="190" cy="90" r="5" fill="#ffffff"></circle>
                <rect x="106" y="150" width="268" height="38" fill="#1b1340" opacity="0.85"></rect>
                <rect x="116" y="158" width="60" height="22" rx="4" fill="#5b2be0"></rect>
                <rect x="184" y="158" width="60" height="22" rx="4" fill="#3b2b7a"></rect>
                <rect x="252" y="158" width="60" height="22" rx="4" fill="#3b2b7a"></rect>

                <circle cx="414" cy="172" r="3" fill="#5fe0cc"></circle>
            </svg>

        <!-- MOBILE -->
        <template lwc:if={isMobile}>
            <svg viewBox="0 0 480 260" role="img" aria-label="Illustration of two phones with 5G signal">
                <rect x="0" y="0" width="480" height="260" fill="#e2f6f2"></rect>
                <path d="M300 60 A 70 70 0 0 1 400 60" stroke="#00a693" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.35"></path>
                <path d="M318 82 A 46 46 0 0 1 382 82" stroke="#00a693" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"></path>
                <path d="M336 104 A 22 22 0 0 1 364 104" stroke="#00a693" stroke-width="8" fill="none" stroke-linecap="round"></path>
                <rect x="140" y="40" width="100" height="196" rx="18" fill="#1b1340"></rect>
                <rect x="150" y="56" width="80" height="160" rx="8" fill="#5b2be0"></rect>
                <rect x="160" y="70" width="60" height="10" rx="5" fill="#ffffff" opacity="0.8"></rect>
                <rect x="160" y="92" width="26" height="26" rx="6" fill="#5fe0cc"></rect>
                <rect x="194" y="92" width="26" height="26" rx="6" fill="#ffb98f"></rect>
                <rect x="160" y="126" width="26" height="26" rx="6" fill="#ffe2a8"></rect>
                <rect x="194" y="126" width="26" height="26" rx="6" fill="#ffffff" opacity="0.8"></rect>
                <rect x="250" y="96" width="84" height="150" rx="16" fill="#3b2b7a"></rect>

            </svg>
        </template>

        <!-- ROUTER + MESH -->
        <template lwc:if={isRouter}>
            <svg viewBox="0 0 480 300" role="img" aria-label="Illustration of the NovaFiber Wi-Fi 6 router and mesh extender">
                <rect x="0" y="0" width="480" height="300" fill="#ece8fb"></rect>
                <path d="M150 120 A 70 70 0 0 1 250 120" stroke="#5b2be0" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.35"></path>
                <path d="M166 140 A 46 46 0 0 1 234 140" stroke="#5b2be0" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.65"></path>
                <rect x="140" y="160" width="120" height="100" rx="22" fill="#1b1340"></rect>
                <rect x="156" y="176" width="88" height="6" rx="3" fill="#3b2b7a"></rect>
                <circle cx="200" cy="230" r="8" fill="#5fe0cc"></circle>
                <rect x="296" y="196" width="64" height="64" rx="32" fill="#f4f1ff" stroke="#1b1340" stroke-width="6"></rect>
                <circle cx="328" cy="228" r="6" fill="#5b2be0"></circle>
                <path d="M300 180 A 40 40 0 0 1 356 180" stroke="#00a693" stroke-width="6" fill="none" stroke-linecap="round"></path>
                <rect x="60" y="262" width="360" height="10" rx="5" fill="#d4ccf5"></rect>
            </svg>
        </template>

        <!-- TECHNICIAN -->
        <template lwc:if={isTechnician}>
            <svg viewBox="0 0 480 340" role="img" aria-label="Illustration of a NovaFiber technician installing fiber equipment">
                <rect x="0" y="0" width="480" height="340" fill="#ece8fb"></rect>
                <rect x="300" y="60" width="140" height="240" fill="#f4f1ff"></rect>
                <rect x="340" y="120" width="64" height="84" rx="8" fill="#1b1340"></rect>
                <circle cx="358" cy="140" r="4" fill="#5fe0cc"></circle>
                <circle cx="372" cy="140" r="4" fill="#5fe0cc"></circle>
                <path d="M372 204 L 372 300" stroke="#5fe0cc" stroke-width="5"></path>
                <!-- technician -->
                <circle cx="230" cy="110" r="26" fill="#ff9e6b"></circle>
                <path d="M200 98 C 205 72, 255 72, 260 98 Z" fill="#5b2be0"></path>
                <rect x="198" y="96" width="70" height="8" rx="4" fill="#5b2be0"></rect>
                <path d="M190 150 C 195 136, 265 136, 270 150 L 278 250 L 182 250 Z" fill="#5b2be0"></path>
                <rect x="214" y="160" width="34" height="18" rx="4" fill="#ffffff"></rect>
                <path d="M262 168 L 330 150" stroke="#ff9e6b" stroke-width="16" stroke-linecap="round"></path>

                <rect x="98" y="256" width="34" height="16" rx="6" fill="none" stroke="#1b1340" stroke-width="5"></rect>

</template>
